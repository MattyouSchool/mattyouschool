<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyOS Mega Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="desktop-body">

    <div class="desktop">
        <div class="icon" ondblclick="openWindow('notepad')">
            <div class="icon-picture">📝</div>
            <div class="icon-label">Kladblok Pro</div>
        </div>
        <div class="icon" ondblclick="openWindow('calc')">
            <div class="icon-picture">🧮</div>
            <div class="icon-label">Rekenmachine</div>
        </div>
    </div>

    <div class="window" id="window-notepad" style="top: 50px; left: 100px; width: 700px; height: 500px;">
        <div class="window-header" onmousedown="startDrag(event, 'window-notepad')">
            <div class="window-title">📝 Kladblok Pro (Los Bestand)</div>
            <button class="close-btn" onclick="closeWindow('notepad')"></button>
        </div>
        <div class="window-content" style="padding:0;">
            <iframe src="notepad.html" class="app-iframe"></iframe>
        </div>
    </div>

    <div class="window" id="window-calc" style="top: 80px; left: 200px; width: 360px; height: 540px;">
        <div class="window-header" onmousedown="startDrag(event, 'window-calc')">
            <div class="window-title">🧮 Rekenmachine</div>
            <button class="close-btn" onclick="closeWindow('calc')"></button>
        </div>
        <div class="window-content" style="padding:0;">
            <iframe src="calc.html" class="app-iframe"></iframe>
        </div>
    </div>

    <div class="start-menu" id="startMenu">
        <div class="start-header">👤 Hoofdgebruiker</div>
        <div class="start-apps-list">
            <div class="start-app-item" onclick="openWindowFromStart('notepad')">📝 Kladblok Pro</div>
            <div class="start-app-item" onclick="openWindowFromStart('calc')">🧮 Rekenmachine</div>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-btn" onclick="toggleStartMenu(event)">❖</button>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="context-menu" id="desktopMenu">
        <div class="menu-item" onclick="changeWallpaper('dark')">🌌 Deep Dark</div>
        <div class="menu-item" onclick="changeWallpaper('neon')">🔮 Cyber Neon</div>
    </div>

    <script>
        // Systeem functies voor klok, sleepwerk en menu's
        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
        setInterval(updateClock, 1000); updateClock();

        function openWindow(id) { document.getElementById(`window-${id}`).classList.add('open'); }
        function closeWindow(id) { document.getElementById(`window-${id}`).classList.remove('open'); }
        function openWindowFromStart(id) { openWindow(id); toggleStartMenu(); }

        const startMenu = document.getElementById('startMenu');
        function toggleStartMenu(e) { if(e) e.stopPropagation(); startMenu.style.display = (startMenu.style.display === 'flex') ? 'none' : 'flex'; }
        window.addEventListener('click', () => startMenu.style.display = 'none');

        // Rechtermuisknop
        const desktopMenu = document.getElementById('desktopMenu');
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); desktopMenu.style.left = e.clientX + "px"; desktopMenu.style.top = e.clientY + "px"; desktopMenu.style.display = "block"; });
        window.addEventListener('click', () => desktopMenu.style.display = "none");
        function changeWallpaper(t) { const b = document.getElementById('desktop-body'); b.style.background = (t==='dark') ? "linear-gradient(135deg, #0f172a, #1e1b4b)" : "linear-gradient(135deg, #2e0854, #ff007f)"; }

        // Drag & Drop
        let currentWindow = null; let offsetX = 0, offsetY = 0;
        function startDrag(e, id) { currentWindow = document.getElementById(id); offsetX = e.clientX - currentWindow.offsetLeft; offsetY = e.clientY - currentWindow.offsetTop; document.addEventListener('mousemove', drag); document.addEventListener('mouseup', stopDrag); }
        function drag(e) { if (!currentWindow) return; currentWindow.style.left = (e.clientX - offsetX) + 'px'; currentWindow.style.top = (e.clientY - offsetY) + 'px'; }
        function stopDrag() { document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', stopDrag); currentWindow = null; }
    </script>
</body>
</html>
